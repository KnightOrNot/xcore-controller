[project]
name = "xcore-controller"
version = "0.2.0"
description = "Local GELLO client and remote CR7 controller roles"
requires-python = ">=3.11,<3.13"
dependencies = ["xcore-adapters", "dynamixel-sdk>=3.7"]

[project.scripts]
xcore-controller = "xcore_controller.cli:main"

[tool.uv.sources]
xcore-adapters = {path = "xcore-adapters", editable = true}

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "xcore-adapters/src", "lerobot-converter/src"]
